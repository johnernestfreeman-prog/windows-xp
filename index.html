<!DOCTYPE html>
<html>
<head>
<title>Portfolio XP</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  .pixel-font { font-family: 'Press Start 2P', monospace; }

  .screen { width: 100vw; height: 100vh; display: none; }
  .screen.active { display: block; }

  /* ================= BOOT SCREEN ================= */
  #bootScreen { background: black; color: white; position: relative; }

  .boot-content {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .win-logo { display: flex; gap: 4px; justify-content: center; margin-bottom: 20px; }
  .win-logo div { width: 45px; height: 45px; transform: skew(-10deg, 5deg); }

  .logo-orange { background: #f25a29; margin-top: -10px; }
  .logo-green  { background: #7ab41d; }
  .logo-blue   { background: #00a4ef; }
  .logo-yellow { background: #ffb900; margin-top: 10px; }

  .your-name { font-size: 20px; letter-spacing: 2px; }
  .portfolio-title { font-size: 40px; margin-top: 10px; }
  .xp-label { color: #f25a29; font-size: 22px; }

  .progress-bar {
    width: 300px; height: 20px; border: 2px solid #444; border-radius: 10px;
    margin: 40px auto 0; overflow: hidden; display: flex; align-items: center; padding: 3px;
  }

  .progress-bar span {
    width: 30px; height: 12px; background: #2255dd; margin-right: 4px;
    border-radius: 2px; animation: slide 1.2s infinite;
  }

  @keyframes slide { 0% {opacity:.3} 50% {opacity:1} 100% {opacity:.3} }

  /* ================= LOGIN SCREEN ================= */
  #loginScreen { background: #4a7fe0; color: white; display: none; flex-direction: column; justify-content: space-between; }
  #loginScreen.active { display: flex; }

  .login-top { background: #163d99; height: 60px; }
  .login-middle { flex: 1; display: flex; align-items: center; padding: 40px; }
  .login-left { flex: 1; text-align: center; }
  .login-left .win-logo div { width: 60px; height: 60px; }
  .login-left .portfolio-title { font-size: 46px; }
  .select-text { margin-top: 20px; font-size: 15px; font-weight: bold; }
  .login-right { flex: 1; border-left: 1px solid white; padding-left: 40px; }

  .user-row {
    display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15);
    padding: 12px 20px; border-radius: 4px; cursor: pointer;
  }
  .user-row:hover { background: rgba(255,255,255,0.3); }

  .avatar {
    width: 50px; height: 50px; border-radius: 4px; border: 2px solid #ffd700;
    background: #88bbee; display: flex; align-items: center; justify-content: center; font-size: 20px;
  }

  .username { font-size: 16px; font-weight: bold; }

  .login-bottom {
    background: #163d99; padding: 15px 30px; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ================= DESKTOP SCREEN ================= */
  #desktopScreen {
    /* NOTE: rename this file to remove the space, e.g. background-xp.jpg,
       and update the path below to match. Spaces in filenames referenced
       from CSS url() are unreliable across servers/tools. */
    background-image: url("images/Background__XP.jpg");
    background-color: #4a7fe0;
    background-size: cover;
    background-position: center;
    position: relative;
    height: 100vh;
  }

  .icon-grid {
    position: absolute; top: 20px; left: 20px;
    display: grid; grid-template-columns: 80px 80px; gap: 20px 40px;
  }

  .icon {
    width: 80px; text-align: center; color: white; font-size: 12px;
    text-shadow: 1px 1px 2px black; cursor: pointer; user-select: none;
  }

  .icon .icon-symbol {
    width: 48px; height: 48px; margin: 0 auto 4px; display: block;
    image-rendering: pixelated;
    filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.6));
  }

  .taskbar {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
    background: linear-gradient(#3f7fdb, #1c4faa 60%, #0b2f7a);
    display: flex; align-items: center; padding: 0 4px; z-index: 500;
  }

  .start-button {
    background: linear-gradient(#6fcf6f, #2d7a2d); color: white; font-weight: bold;
    font-style: italic; border: none; border-radius: 14px 4px 4px 14px;
    padding: 3px 14px 3px 8px; cursor: pointer; font-size: 13px;
  }

  .taskbar-windows { display: flex; gap: 4px; margin-left: 8px; flex: 1; }

  .taskbar-item {
    background: #2d5fc0; color: white; font-size: 12px; padding: 3px 10px;
    border-radius: 3px; border: 1px solid #6fa0f5; cursor: pointer; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .tray {
    color: white; font-size: 12px; background: #1c4faa;
    padding: 2px 10px; border-radius: 3px 0 0 3px;
  }

  /* ================= WINDOWS ================= */
  .xp-window {
    position: absolute;
    width: 480px;
    min-height: 320px;
    background: #ece9d8;
    border: 2px solid #0831d9;
    border-radius: 6px 6px 0 0;
    box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .xp-titlebar {
    background: linear-gradient(#2f71e8, #0f3fc7 60%, #0a2f9c);
    color: white; font-weight: bold; font-size: 13px;
    padding: 5px 6px 5px 10px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: move;
  }

  .xp-titlebar-buttons button {
    width: 20px; height: 20px; margin-left: 3px; border: 1px solid #fff;
    background: #d94141; color: white; font-weight: bold; cursor: pointer; border-radius: 3px;
  }

  .xp-window-body {
    flex: 1;
    background: white;
    padding: 12px;
    overflow: auto;
    font-size: 13px;
    color: #222;
  }

  /* ---- Minesweeper ---- */
  .ms-grid {
    display: grid;
    grid-template-columns: repeat(9, 26px);
    grid-gap: 1px;
    background: #999;
    width: fit-content;
    margin: 0 auto;
  }
  .ms-cell {
    width: 26px; height: 26px; background: #bdbdbd; border: 2px outset #eee;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; cursor: pointer; user-select: none;
  }
  .ms-cell.revealed { border: 1px solid #999; background: #d6d6d6; cursor: default; }
  .ms-cell.mine { background: #e04040; }
  .ms-status { text-align: center; margin-bottom: 8px; font-weight: bold; }

  /* ---- Notepad ---- */
  .notepad-area { width: 100%; height: 260px; resize: none; font-family: monospace; font-size: 13px; }

  /* ---- Contact form ---- */
  .contact-form label { display: block; margin-top: 10px; font-weight: bold; }
  .contact-form input, .contact-form textarea {
    width: 100%; padding: 6px; margin-top: 4px; border: 1px solid #999; font-family: Tahoma;
  }
  .contact-form button {
    margin-top: 14px; padding: 8px 16px; background: #2d5fc0; color: white;
    border: none; border-radius: 3px; cursor: pointer; font-weight: bold;
  }
</style>
</head>
<body>

<!-- ========== SCREEN 1: BOOT ========== -->
<div class="screen active" id="bootScreen" onclick="showScreen('loginScreen')">
  <div class="boot-content pixel-font">
    <div class="win-logo">
      <div class="logo-orange"></div><div class="logo-green"></div>
      <div class="logo-blue"></div><div class="logo-yellow"></div>
    </div>
    <div class="your-name">John Freeman</div>
    <div class="portfolio-title">Portfolio <span class="xp-label">XP</span></div>
    <div class="progress-bar">
      <span style="animation-delay:0s"></span>
      <span style="animation-delay:0.2s"></span>
      <span style="animation-delay:0.4s"></span>
    </div>
  </div>
</div>

<!-- ========== SCREEN 2: LOGIN ========== -->
<div class="screen" id="loginScreen">
  <div class="login-top"></div>
  <div class="login-middle">
    <div class="login-left pixel-font">
      <div class="win-logo">
        <div class="logo-orange"></div><div class="logo-green"></div>
        <div class="logo-blue"></div><div class="logo-yellow"></div>
      </div>
      <div class="your-name">John Freeman</div>
      <div class="portfolio-title">Portfolio <span class="xp-label">XP</span></div>
      <div class="select-text">Select your username to begin.</div>
    </div>
    <div class="login-right">
      <div class="user-row" onclick="showScreen('desktopScreen')">
        <div class="avatar">&#128100;</div>
        <div class="username">John Freeman</div>
      </div>
    </div>
  </div>
  <div class="login-bottom">
    <div>English</div>
    <div>After logging in, you can browse through my portfolio. Click a folder to begin.</div>
  </div>
</div>

<!-- ========== SCREEN 3: DESKTOP ========== -->
<div class="screen" id="desktopScreen">
  <div class="icon-grid">
    <div class="icon" ondblclick="openWindow('contact')">
      <img class="icon-symbol" src="images/contact-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('📤'))">
      Contact me
    </div>
    <div class="icon" ondblclick="openWindow('cv')">
      <img class="icon-symbol" src="images/cv-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('📖'))">
      My CV
    </div>
    <div class="icon" ondblclick="openWindow('music')">
      <img class="icon-symbol" src="images/music-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('💿'))">
      My Musics
    </div>
    <div class="icon" ondblclick="openWindow('minesweeper')">
      <img class="icon-symbol" src="images/minesweeper-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('💣'))">
      Minesweeper
    </div>
    <div class="icon" ondblclick="openWindow('notepad')">
      <img class="icon-symbol" src="images/Notepad-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('📝'))">
      Notepad
    </div>
    <div class="icon" ondblclick="openWindow('blobby')">
      <!-- NOTE: rename this file to remove the space, e.g. blobby-volley.png -->
      <img class="icon-symbol" src="images/blobby_volley-removebg-preview.png" alt="" onerror="this.replaceWith(emojiIcon('🏐'))">
      Blobby Volley
    </div>
  </div>

  <div id="windowLayer"></div>

  <div class="taskbar">
    <button class="start-button">&#9873; start</button>
    <div class="taskbar-windows" id="taskbarWindows"></div>
    <div class="tray" id="tray">EN &nbsp; 1:39 PM</div>
  </div>
</div>

<script>
  /* ---------------- Screen switching ---------------- */
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }
  setTimeout(() => showScreen("loginScreen"), 4000);

  function updateClock() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    if (m < 10) m = "0" + m;
    document.getElementById("tray").textContent = "EN   " + h + ":" + m + " " + ampm;
  }
  setInterval(updateClock, 1000);
  updateClock();

  function emojiIcon(char) {
    var d = document.createElement('div');
    d.className = 'icon-symbol';
    d.textContent = char;
    d.style = 'font-size:36px;line-height:48px';
    return d;
  }

  /* ---------------- Window manager ---------------- */
  var windowCount = 0;
  var openWindows = {};

  var windowDefs = {
    contact: { title: "Contact Me", render: renderContact },
    cv: { title: "My CV", render: renderCV },
    music: { title: "My Musics", render: renderMusic },
    minesweeper: { title: "Minesweeper", render: renderMinesweeper },
    notepad: { title: "Notepad", render: renderNotepad },
    blobby: { title: "Blobby Volley", render: renderBlobby }
  };

  function openWindow(key) {
    if (openWindows[key]) {
      openWindows[key].style.zIndex = 1000 + windowCount++;
      return;
    }
    var def = windowDefs[key];
    var win = document.createElement('div');
    win.className = 'xp-window';
    windowCount++;
    win.style.top = (60 + (windowCount % 5) * 25) + 'px';
    win.style.left = (120 + (windowCount % 5) * 30) + 'px';
    win.style.zIndex = 1000 + windowCount;

    win.innerHTML =
      '<div class="xp-titlebar">' +
        '<span>' + def.title + '</span>' +
        '<div class="xp-titlebar-buttons"><button onclick="closeWindow(\'' + key + '\')">X</button></div>' +
      '</div>' +
      '<div class="xp-window-body">' + def.render() + '</div>';

    document.getElementById('windowLayer').appendChild(win);
    openWindows[key] = win;
    makeDraggable(win);
    addTaskbarItem(key, def.title);

    if (key === 'minesweeper') initMinesweeper(win);
    if (key === 'blobby') initBlobby(win);
  }

  function closeWindow(key) {
    if (openWindows[key]) {
      openWindows[key].remove();
      delete openWindows[key];
    }
    var tItem = document.getElementById('taskbar-' + key);
    if (tItem) tItem.remove();
  }

  function addTaskbarItem(key, title) {
    var bar = document.getElementById('taskbarWindows');
    var item = document.createElement('div');
    item.className = 'taskbar-item';
    item.id = 'taskbar-' + key;
    item.textContent = title;
    item.onclick = function () {
      var w = openWindows[key];
      if (w) { w.style.zIndex = 1000 + windowCount++; }
    };
    bar.appendChild(item);
  }

  function makeDraggable(win) {
    var titlebar = win.querySelector('.xp-titlebar');
    var offsetX, offsetY, dragging = false;
    titlebar.addEventListener('mousedown', function (e) {
      dragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
      win.style.zIndex = 1000 + windowCount++;
    });
    document.addEventListener('mousemove', function (e) {
      if (dragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
    document.addEventListener('mouseup', function () { dragging = false; });
  }

  /* ---------------- Window content ---------------- */
  function renderContact() {
    return (
      '<div class="contact-form">' +
      '<label>Name</label><input type="text" id="cName">' +
      '<label>Your Email</label><input type="email" id="cEmail">' +
      '<label>Message</label><textarea rows="5" id="cMsg"></textarea>' +
      '<button onclick="sendContact()">Send</button>' +
      '</div>'
    );
  }
/*Email me here*/
  function sendContact() {
    var name = document.getElementById('cName').value;
    var email = document.getElementById('cEmail').value;
    var msg = document.getElementById('cMsg').value;
    var subject = encodeURIComponent('Portfolio contact from ' + name);
    var body = encodeURIComponent(msg + '\n\nFrom: ' + email);
    window.location.href = 'mailto:john.ernest.freeman@gmail.com?subject=' + subject + '&body=' + body;
  }
/*My Resume*/
  function renderCV() {
    // Place your resume PDF at /files/resume.pdf
    return '<iframe src="files/resume.pdf" style="width:100%;height:400px;border:none;"></iframe>' +
           '<p style="text-align:center;margin-top:8px;"><a href="files/resume.pdf" download>Download CV</a></p>';
  }
/*Music player*/
  function renderMusic() {
    // Add your own tracks to /files/music/ and list them here
    return (
      '<p>Tracks:</p>' +
      '<audio controls style="width:100%;margin-bottom:10px;" src="files/music/track1.mp3"></audio>' +
      '<audio controls style="width:100%;margin-bottom:10px;" src="files/music/track2.mp3"></audio>'
    );
  }
/*Write in notepad*/
  function renderNotepad() {
    return '<textarea class="notepad-area" placeholder="Type here..."></textarea>';
  }
/*===================================
     VOLLEY BLOBBY GAME
     =================================*/
  function renderBlobby() {
    return (
      '<div class="ms-status">First to 5 points wins! P1: A/D move, W jump &nbsp;|&nbsp; P2: \u2190/\u2192 move, \u2191 jump</div>' +
      '<canvas id="blobbyCanvas" width="460" height="280" style="display:block;margin:0 auto;background:#5fb8e0;border:2px solid #333;"></canvas>'
    );
  }

  function initBlobby(win) {
    var canvas = win.querySelector('#blobbyCanvas');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var GROUND_Y = H - 20;
    var GRAVITY = 0.5;
    var NET_X = W / 2, NET_H = 90, NET_W = 8;

    // Real Blender-rendered sprites
    var courtImg = new Image(); courtImg.src = 'images/blobby_court_bg.webp';
    var redImg = new Image(); redImg.src = 'images/red_bob.png';
    var blueImg = new Image(); blueImg.src = 'images/blue_bob.png';
    var ballImg = new Image(); ballImg.src = 'images/volleyball.png';

    var keys = {};
    document.addEventListener('keydown', function (e) { keys[e.key] = true; });
    document.addEventListener('keyup', function (e) { keys[e.key] = false; });

    function makeBlob(x, img) {
      return { x: x, y: GROUND_Y, vy: 0, r: 26, img: img, onGround: true, score: 0 };
    }

    var p1 = makeBlob(100, redImg);
    var p2 = makeBlob(W - 100, blueImg);
    var ball = { x: W / 2, y: 80, vx: 3, vy: 0, r: 14 };
    var gameOver = false;

    function resetBall(towardP1) {
      ball.x = towardP1 ? NET_X - 120 : NET_X + 120;
      ball.y = 80;
      ball.vx = towardP1 ? -2 : 2;
      ball.vy = 0;
    }

    function circleHit(cx, cy, cr, bx, by, br) {
      var dx = cx - bx, dy = cy - by;
      return Math.sqrt(dx * dx + dy * dy) < (cr + br);
    }

    function update() {
      if (gameOver) return;

      // Player 1 controls
      if (keys['a'] || keys['A']) p1.x -= 4;
      if (keys['d'] || keys['D']) p1.x += 4;
      if ((keys['w'] || keys['W']) && p1.onGround) { p1.vy = -11; p1.onGround = false; }

      // Player 2 controls
      if (keys['ArrowLeft']) p2.x -= 4;
      if (keys['ArrowRight']) p2.x += 4;
      if (keys['ArrowUp'] && p2.onGround) { p2.vy = -11; p2.onGround = false; }

      // Keep players in their half, on court
      p1.x = Math.max(p1.r, Math.min(NET_X - NET_W / 2 - p1.r, p1.x));
      p2.x = Math.max(NET_X + NET_W / 2 + p2.r, Math.min(W - p2.r, p2.x));

      [p1, p2].forEach(function (p) {
        p.vy += GRAVITY;
        p.y += p.vy;
        if (p.y >= GROUND_Y) { p.y = GROUND_Y; p.vy = 0; p.onGround = true; }
      });

      // Ball physics
      ball.vy += GRAVITY * 0.7;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Ball off side walls
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
      // Ball off ceiling
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

      // Ball vs net
      var netTop = GROUND_Y - NET_H;
      if (ball.x + ball.r > NET_X - NET_W / 2 && ball.x - ball.r < NET_X + NET_W / 2 && ball.y + ball.r > netTop) {
        if (ball.x < NET_X) { ball.x = NET_X - NET_W / 2 - ball.r; ball.vx = -Math.abs(ball.vx); }
        else { ball.x = NET_X + NET_W / 2 + ball.r; ball.vx = Math.abs(ball.vx); }
      }

      // Ball vs players (head-bounce)
      [p1, p2].forEach(function (p) {
        if (circleHit(p.x, p.y - 10, p.r, ball.x, ball.y, ball.r)) {
          var dx = ball.x - p.x, dy = (ball.y) - (p.y - 10);
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          ball.vx = (dx / dist) * 7 + (p === p1 ? 2 : -2);
          ball.vy = -9;
        }
      });

      // Ball hits ground -> score
      if (ball.y + ball.r >= GROUND_Y) {
        if (ball.x < NET_X) { p2.score++; resetBall(false); }
        else { p1.score++; resetBall(true); }
        if (p1.score >= 5 || p2.score >= 5) gameOver = true;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // court background - real photo if loaded, fallback color while it loads
      if (courtImg.complete && courtImg.naturalWidth > 0) {
        ctx.drawImage(courtImg, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#5fb8e0';
        ctx.fillRect(0, 0, W, H);
      }
      // net
      ctx.fillStyle = '#fff';
      ctx.fillRect(NET_X - NET_W / 2, GROUND_Y - NET_H, NET_W, NET_H);
      // players - real rendered blob sprites
      [p1, p2].forEach(function (p) {
        if (p.img.complete && p.img.naturalWidth > 0) {
          var w = p.r * 2.2, h = w * (p.img.naturalHeight / p.img.naturalWidth);
          ctx.drawImage(p.img, p.x - w / 2, p.y - h + 6, w, h);
        } else {
          ctx.fillStyle = (p === p1) ? '#e04040' : '#4060e0';
          ctx.beginPath();
          ctx.arc(p.x, p.y - 10, p.r, Math.PI, 0);
          ctx.fill();
        }
      });
      // ball - real rendered volleyball sprite
      if (ballImg.complete && ballImg.naturalWidth > 0) {
        var bs = ball.r * 2.2;
        ctx.drawImage(ballImg, ball.x - bs / 2, ball.y - bs / 2, bs, bs);
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.stroke();
      }
      // score
      ctx.fillStyle = '#000';
      ctx.font = 'bold 20px Tahoma';
      ctx.fillText(p1.score, NET_X - 60, 30);
      ctx.fillText(p2.score, NET_X + 40, 30);

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, H / 2 - 30, W, 60);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Tahoma';
        var winner = p1.score > p2.score ? 'Player 1' : 'Player 2';
        ctx.fillText(winner + ' wins!', W / 2 - 70, H / 2 + 8);
      }
    }

    function loop() {
      if (!document.body.contains(canvas)) return; // stop loop if window closed
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  }

  /* ---------------- Minesweeper game ---------------- */
  function renderMinesweeper() {
    return '<div class="ms-status" id="msStatus">Find all the mines!</div><div class="ms-grid" id="msGrid"></div>';
  }

  function initMinesweeper(win) {
    var SIZE = 9, MINES = 10;
    var grid = win.querySelector('#msGrid');
    var status = win.querySelector('#msStatus');
    var cells = [];
    var revealedCount = 0;
    var gameOver = false;

    var board = [];
    for (var r = 0; r < SIZE; r++) board.push(new Array(SIZE).fill(0));

    var placed = 0;
    while (placed < MINES) {
      var rr = Math.floor(Math.random() * SIZE);
      var cc = Math.floor(Math.random() * SIZE);
      if (board[rr][cc] !== 'M') { board[rr][cc] = 'M'; placed++; }
    }
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 'M') continue;
        var count = 0;
        for (var dr = -1; dr <= 1; dr++)
          for (var dc = -1; dc <= 1; dc++) {
            var nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === 'M') count++;
          }
        board[r][c] = count;
      }
    }

    for (var r = 0; r < SIZE; r++) {
      cells.push([]);
      for (var c = 0; c < SIZE; c++) {
        var cell = document.createElement('div');
        cell.className = 'ms-cell';
        cell.dataset.r = r; cell.dataset.c = c;
        cell.addEventListener('click', function () { reveal(+this.dataset.r, +this.dataset.c); });
        cell.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          if (gameOver) return;
          if (this.classList.contains('revealed')) return;
          this.textContent = this.textContent === '🚩' ? '' : '🚩';
        });
        grid.appendChild(cell);
        cells[r].push(cell);
      }
    }

    function reveal(r, c) {
      if (gameOver) return;
      var cell = cells[r][c];
      if (cell.classList.contains('revealed')) return;
      cell.classList.add('revealed');
      cell.textContent = '';

      if (board[r][c] === 'M') {
        cell.classList.add('mine');
        cell.textContent = '💣';
        gameOver = true;
        status.textContent = 'Boom! Game over.';
        revealAllMines();
        return;
      }

      revealedCount++;
      if (board[r][c] > 0) {
        cell.textContent = board[r][c];
      } else {
        for (var dr = -1; dr <= 1; dr++)
          for (var dc = -1; dc <= 1; dc++) {
            var nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) reveal(nr, nc);
          }
      }

      if (revealedCount === SIZE * SIZE - MINES) {
        gameOver = true;
        status.textContent = 'You win!';
      }
    }

    function revealAllMines() {
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (board[r][c] === 'M') { cells[r][c].classList.add('revealed', 'mine'); cells[r][c].textContent = '💣'; }
    }
  }
</script>
